<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S5 · 模特列表 — Photo Collection Android</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div id="pagebar" class="pagebar"></div>

<div class="stage">
  <div class="phone"><div class="notch"></div>
    <div class="screen dark">
      <div class="blur-canvas" aria-hidden="true"><img src="../mock/cover-2.jpg" alt=""></div>
      <div id="statusbar-slot"></div>

      <div class="appbar">
        <span class="wordmark serif">模特</span>
        <span class="actions"><span data-icon="search"></span></span>
      </div>

      <div class="filterrow">
        <span class="chip on">全部</span>
        <span class="chip">已收藏</span>
        <span class="spacer"></span>
        <span class="count num">18 位模特</span>
      </div>

      <div class="grid2" style="padding-bottom:96px;">
        <div class="card"><img class="ph" src="../mock/cover-1.jpg"><div class="t serif">斉藤里奈</div><div class="m num">3 部写真 · 342 张</div></div>
        <div class="card"><img class="ph" src="../mock/cover-2.jpg"><div class="t serif">瀬戸環奈</div><div class="m num">2 部写真 · 186 张</div></div>
        <div class="card"><img class="ph" src="../mock/cover-3.jpg"><div class="t serif">森雏子</div><div class="m num">4 部写真 · 351 张</div></div>
        <div class="card"><img class="ph" src="../mock/cover-4.jpg"><div class="t serif">美澄寧々</div><div class="m num">1 部写真 · 92 张</div></div>
        <div class="card"><img class="ph" src="../mock/cover-5.jpg"><div class="t serif">瑠川優里</div><div class="m num">2 部写真 · 204 张</div></div>
        <div class="card"><img class="ph" src="../mock/cover-6.jpg"><div class="t serif">大橋未来</div><div class="m num">1 部写真 · 74 张</div></div>
      </div>

      <div id="tabbar-slot" data-tab="models"></div>
    </div>
  </div>

  <aside id="notes" class="notes"></aside>
</div>

<script src="pages.js"></script>
<script>const PAGE_ID = 's5-models';</script>
<script src="ui.js"></script>
<script>
  document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = ICONS[el.dataset.icon]; });
</script>
</body>
</html>
