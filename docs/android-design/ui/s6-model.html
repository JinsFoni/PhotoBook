<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S6 · 模特详情 — Photo Collection Android</title>
<link rel="stylesheet" href="ui.css">
<style>
  /* 本页状态栏叠在头图上,用白字 */
  .screen .statusbar.overlay {
    position:absolute; top:0; left:0; right:0; z-index:6; color:#fff;
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="liquid-glass" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="2" result="softNoise"/>
      <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="26" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
<div id="pagebar" class="pagebar"></div>

<div class="stage">
  <div class="phone"><div class="notch"></div>
    <div class="screen light">
      <div class="blur-canvas" aria-hidden="true"><img src="../mock/cover-1.jpg" alt=""></div>
      <div class="statusbar overlay" style="padding-top:8px;">
        <span>9:41</span>
        <span class="sb-icons">
          <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><rect x="0" y="7" width="2.6" height="4" rx="0.6"/><rect x="4.2" y="4.8" width="2.6" height="6.2" rx="0.6"/><rect x="8.4" y="2.4" width="2.6" height="8.6" rx="0.6"/><rect x="12.6" y="0" width="2.6" height="11" rx="0.6"/></svg>
          <svg width="23" height="11" viewBox="0 0 25 12" fill="none" stroke="currentColor"><rect x="1" y="1" width="20" height="10" rx="3"/><rect x="3" y="3" width="14" height="6" rx="1.5" fill="currentColor" stroke="none"/><path d="M23 4v4" stroke-linecap="round"/></svg>
        </span>
      </div>

      <div class="model-hero">
        <img src="../mock/cover-1.jpg" alt="">
        <div class="veil"></div>
        <div class="mh-fab back" data-icon="back"></div>
        <div class="mh-fab fav" data-icon="heartFill"></div>
        <div class="mh-txt">
          <h1 class="serif">斉藤 里奈</h1>
          <div class="stats">
            <span><b class="num">3</b>写真</span>
            <span><b class="num">342</b>照片</span>
            <span><b>JP</b>1998 · 160cm</span>
          </div>
        </div>
      </div>

      <div class="bio">
        东京都出身。以清新自然的镜头感著称,活跃于数码限定写真与杂志企划,代表作《Attractive》系列。
      </div>

      <div class="section-head" style="padding-top:18px;">
        <h2 class="serif">写真作品</h2><a href="#">全部 3 部</a>
      </div>
      <div class="hscroll">
        <div class="card"><img class="ph" src="../mock/cover-1.jpg"><div class="t serif">Attractive</div><div class="m num">128 张 · 2025.09</div></div>
        <div class="card"><img class="ph" src="../mock/cover-5.jpg"><div class="t serif">Solitude</div><div class="m num">118 张 · 2025.05</div></div>
        <div class="card"><img class="ph" src="../mock/cover-9.jpg"><div class="t serif">Hometown</div><div class="m num">96 张 · 2024.11</div></div>
      </div>

      <div id="tabbar-slot" style="display:none" data-tab="models"></div>
    </div>
  </div>

  <aside id="notes" class="notes"></aside>
</div>

<script src="pages.js"></script>
<script>const PAGE_ID = 's6-model';</script>
<script src="ui.js"></script>
<script>
  document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = ICONS[el.dataset.icon]; });
</script>
</body>
</html>
