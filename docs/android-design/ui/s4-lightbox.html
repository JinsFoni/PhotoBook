<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S4 · 灯箱 — Photo Collection Android</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="liquid-glass" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="2" result="softNoise"/>
      <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="26" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
<div id="pagebar" class="pagebar"></div>

<div class="stage">
  <div class="phone"><div class="notch"></div>
    <div class="screen light lightbox-screen">
      <div class="blur-canvas" aria-hidden="true"><img src="../mock/hero.jpg" alt=""></div>
      <div id="statusbar-slot"></div>

      <div class="lb-full">
        <img src="../mock/hero.jpg" alt="">
      </div>

      <div class="lb-top">
        <span data-icon="close"></span>
        <span class="idx num">12 / 128</span>
        <span data-icon="settings"></span>
      </div>

      <div class="lb-bottom">
        <div class="lb-title serif">Attractive</div>
        <div class="lb-sub">斉藤里奈 · <span class="num">059.jpg</span></div>
        <div class="lb-actions">
          <div class="act faved">
            <span data-icon="heartFill"></span>
            已收藏
          </div>
          <div class="act">
            <span data-icon="download"></span>
            下载原图
          </div>
          <div class="act dim">
            <span data-icon="copy"></span>
            复制
          </div>
        </div>
      </div>

      <div class="tabbar-space" style="height:104px;"></div>
    </div>
  </div>

  <aside id="notes" class="notes"></aside>
</div>

<script src="pages.js"></script>
<script>const PAGE_ID = 's4-lightbox';</script>
<script src="ui.js"></script>
<script>
  document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = ICONS[el.dataset.icon]; });
</script>
</body>
</html>
