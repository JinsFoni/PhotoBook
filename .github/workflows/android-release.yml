# 仅在发布 Release(published)时自动构建 Android APK(正式签名,可直装可升级)
# 并作为 release 资产上传。普通推送 / PR 不触发。
# 签名材料来自 Secrets(ANDROID_KEYSTORE_BASE64 等);未配置时回落 debug 签名。
name: Android Build (Release)

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # 版本号从发布 tag 注入:versionName 去掉 v 前缀;versionCode = major*10000 + minor*100 + patch
      - name: Derive version from tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          name="${TAG#v}"
          major=$(echo "$name" | cut -d. -f1)
          minor=$(echo "$name" | cut -d. -f2)
          patch=$(echo "$name" | cut -d. -f3)
          code=$((major * 10000 + minor * 100 + patch))
          echo "versionName=$name" >> "$GITHUB_OUTPUT"
          echo "versionCode=$code" >> "$GITHUB_OUTPUT"

      # 构建前跑单元测试,失败则中止发版构建
      - name: Unit tests
        run: >
          ./gradlew :app:testDebugUnitTest
          -PversionName=${{ steps.version.outputs.versionName }}
          -PversionCode=${{ steps.version.outputs.versionCode }}

      # 有 keystore 才解出;gradle 检测到 app/release.keystore 即走正式签名
      - name: Decode release keystore
        working-directory: android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          else
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64,本次 APK 将使用 debug 签名"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew :app:assembleRelease
          -PversionName=${{ steps.version.outputs.versionName }}
          -PversionCode=${{ steps.version.outputs.versionCode }}

      - name: Rename APK with tag
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/PhotoBook-${{ github.event.release.tag_name }}.apk

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/PhotoBook-*.apk

      - name: Summary
        run: |
          echo "### Android APK 已构建 :robot:" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: \`${{ github.event.release.tag_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 产物: PhotoBook-\`${{ github.event.release.tag_name }}\`.apk" >> $GITHUB_STEP_SUMMARY
