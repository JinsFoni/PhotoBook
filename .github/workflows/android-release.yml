# 仅在发布 Release(published)时自动构建 Android APK(debug 签名,可直装)
# 并作为 release 资产上传。普通推送 / PR 不触发。
name: Android Build (Release)

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # 构建前跑单元测试,失败则中止发版构建
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      # 未配置正式签名 → release 未签名,装不上;用 debug 签名产出可直装 APK
      - name: Sign APK with debug key
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
             app/build/outputs/apk/release/app-release.apk
          ${ANDROID_HOME}/build-tools/36.0.0/apksigner sign \
            --ks debug.keystore --ks-pass pass:android \
            --ks-key-alias androiddebugkey --key-pass pass:android \
            app/build/outputs/apk/release/app-release.apk

      - name: Rename APK with tag
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/PhotoBook-${{ github.event.release.tag_name }}.apk

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/PhotoBook-*.apk

      - name: Summary
        run: |
          echo "### Android APK 已构建 :robot:" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: \`${{ github.event.release.tag_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 产物: PhotoBook-\`${{ github.event.release.tag_name }}\`.apk(debug 签名,可直装)" >> $GITHUB_STEP_SUMMARY
