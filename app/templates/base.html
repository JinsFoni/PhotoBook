<!doctype html>
{% set theme = 'light' %}
<html lang="{{ lang() }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c0d0f'/%3E%3Crect x='7.5' y='7.5' width='17' height='17' fill='none' stroke='%23f7f7f5' stroke-width='1.6'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0c0d0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body data-page="{{ page }}">
<a class="skip" href="#main">{{ t('Skip to content') }}</a>
{% block body %}{% endblock %}
<script>window.PB_DATA = {{ data_json | default('{}') | safe }};
window.PB_BOOT = {{ boot_json(request) | safe }};</script>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
