<!doctype html>
<html lang="{{ lang() }}" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="theme-color" content="#0c0d0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/static/manifest.webmanifest">
<script>
/* 首屏前同步用户主题(localStorage), 避免整页导航时
   先按默认渲染再被尾部 JS 纠正 → 页面闪一下;
   并在虚化主题下首帧直出垫底背景(同一张图跨页不再重淡入) */
(function () {
  var t, f;
  try { t = localStorage.getItem("pc.theme.v1"); } catch (e) {}
  if (t === "dark" || t === "light" || t === "blur") {
    document.documentElement.setAttribute("data-theme", t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", t === "light" ? "#ffffff" : "#0c0d0f");
  }
  /* 字体风格与主题同一套机制: 首屏前落到 html[data-font], 避免闪字体 */
  try { f = localStorage.getItem("pc.font.v1"); } catch (e) {}
  if (f === "cute" || f === "minimal" || f === "modern") {
    document.documentElement.setAttribute("data-font", f);
  }
  if (t !== "blur") {
    /* 非虚化: 清掉标记, 回虚化时走淡入 */
    try { localStorage.removeItem("pc.blur.fp"); } catch (e) {}
    return;
  }
  var info = {{ blur_src_json(request) | safe }};
  if (!info || !info.src) return;
  var same = false;
  try { same = localStorage.getItem("pc.blur.fp") === info.fp; } catch (e) {}
  try { localStorage.setItem("pc.blur.fp", info.fp); } catch (e) {}
  /* 同一张图跨页导航: 首帧直接全亮, 不播 620ms 淡入;
   * 非同图: 容器/纱层即时可见(深底不闪黑), 图走默认淡入 */
  var s = document.createElement("style");
  s.textContent =
    ".page-blur{opacity:1!important;visibility:visible!important}" +
    (same ? ".page-blur__zoom{opacity:1!important}" : "");
  document.head.appendChild(s);
  var i = new Image();
  i.alt = "";
  i.src = info.src;
  i.dataset.pageBlurImg = "1";
  var adopt = function () {
    var el = document.querySelector("[data-page-blur]");
    if (!el || el.querySelector("img")) return;
    /* img 挂进 zoom 容器(img 静止承载 blur 滤镜只栅格化一次,
       缩放动画在外层, 同层混用落定后会残留陈旧 tile 成矩形亮区) */
    var z = el.querySelector(".page-blur__zoom");
    if (!z) { z = document.createElement("div"); z.className = "page-blur__zoom"; el.appendChild(z); }
    z.appendChild(i);
    el.setAttribute("data-ready", "true");
  };
  if (document.body) adopt();
  else document.addEventListener("DOMContentLoaded", adopt);
})();
</script>
<!-- 第7组字体: 字帮玩酷体(拉丁+汉字+假名) × Gamja Flower(谚文+缺字兜底), 全部自托管 -->
<link rel="stylesheet" href="/static/fonts/g7.css?v={{ asset_ver }}">
<link rel="stylesheet" href="/static/fonts/packs.css?v={{ asset_ver }}">
<link rel="stylesheet" href="/static/fonts/wordmark.css?v={{ asset_ver }}">
<link rel="preload" as="font" type="font/woff2" crossorigin
      href="/static/fonts/wordmark-serif.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin
      href="/static/fonts/g7/wanku-400.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin
      href="/static/fonts/g7/gamjaflower-400.woff2">
<link rel="stylesheet" href="/static/app.css?v={{ asset_ver }}">
</head>
<body data-page="{{ page }}">
<div class="page-blur" data-page-blur data-on="false" aria-hidden="true"><div class="page-blur__zoom"></div></div>
<a class="skip" href="#main">{{ t('Skip to content') }}</a>
{% block body %}{% endblock %}
<script>window.PB_DATA = {{ data_json | default('{}') | safe }};
window.PB_BOOT = {{ boot_json(request) | safe }};</script>
<script src="/static/app.js?v={{ asset_ver }}"></script>
<script>
/* PWA: 注册 service worker(可安装 + 离线兜底)。失败静默, 不影响正常使用 */
if ("serviceWorker" in navigator && {{ "true" if is_pwa else "false" }}) {
  navigator.serviceWorker.register("/sw.js").catch(function () {});
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
