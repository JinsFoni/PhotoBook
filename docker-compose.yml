services:
  photobook:
    # 使用 GHCR 发布镜像(多架构 amd64/arm64, 随 Release 自动更新)
    # 本地改动需自建时: 注释掉 image 行, 换成 build: . 后 up -d --build
    image: ghcr.io/jinsfoni/photobook:latest
    container_name: photobook
    restart: unless-stopped
    ports:
      - "${PHOTOBOOK_PORT:-8777}:8777"
    environment:
      HARVEST_ENABLED: ${HARVEST_ENABLED:-0}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/db:/data/db          # SQLite 数据库
      - ./data/media:/data/media    # 演示图与缩略图缓存
      - ./data/library:/data/library  # 采集归档根目录
